<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HWDK 조립공종</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f4f6f8;
  color:#222;
}
.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:26px;
  border-radius:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.10);
}
h1{
  margin:0 0 7px;
  color:#16324f;
  font-size:28px;
}
.sub{
  color:#666;
  margin-bottom:22px;
}
label{
  display:block;
  margin:13px 0 5px;
  font-weight:700;
}
input{
  width:100%;
  padding:12px;
  border:1px solid #ccd3d9;
  border-radius:8px;
  font-size:16px;
}
button{
  width:100%;
  border:0;
  border-radius:8px;
  padding:13px;
  margin-top:12px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}
.primary{
  background:#16324f;
  color:#fff;
}
.secondary{
  background:#e8edf2;
  color:#222;
}
.success{
  background:#167148;
  color:#fff;
}
.status{
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  line-height:1.6;
  display:none;
}
.status.ok{
  display:block;
  background:#e1f3e8;
  color:#14623d;
}
.status.err{
  display:block;
  background:#fde8e8;
  color:#9b2222;
}
.status.info{
  display:block;
  background:#eef5fb;
  color:#174f7c;
}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:18px;
}
.tabs button{
  margin:0;
  background:#e8edf2;
  color:#333;
}
.tabs button.active{
  background:#16324f;
  color:#fff;
}
.hidden{
  display:none!important;
}
.home-info{
  margin-top:16px;
  padding:14px;
  background:#eef5fb;
  border-radius:9px;
  line-height:1.7;
}
</style>
</head>

<body>

<div class="wrap">

  <div id="authCard" class="card">

    <h1>HWDK 조립공종</h1>
    <div class="sub">조립공종 작업관리 시스템</div>

    <div class="tabs">
      <button id="loginTab" class="active">로그인</button>
      <button id="signupTab">회원가입</button>
    </div>

    <div id="loginBox">

      <label>아이디</label>
      <input
        id="loginId"
        autocomplete="username"
        placeholder="아이디 입력"
      >

      <label>비밀번호</label>
      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        placeholder="비밀번호 입력"
      >

      <button
        id="loginBtn"
        class="primary"
      >
        로그인
      </button>

    </div>


    <div id="signupBox" class="hidden">

      <label>아이디</label>
      <input
        id="signupId"
        autocomplete="username"
        placeholder="영문/숫자 아이디"
      >

      <label>이름</label>
      <input
        id="signupName"
        placeholder="홍길동"
      >

      <label>비밀번호</label>
      <input
        id="signupPassword"
        type="password"
        autocomplete="new-password"
        placeholder="6자 이상"
      >

      <label>비밀번호 확인</label>
      <input
        id="signupPassword2"
        type="password"
        autocomplete="new-password"
        placeholder="비밀번호 다시 입력"
      >

      <button
        id="signupBtn"
        class="success"
      >
        회원가입
      </button>

    </div>

    <div id="authStatus" class="status"></div>

  </div>


  <div id="homeCard" class="card hidden">

    <h1>HWDK 조립공종</h1>
    <div class="sub">로그인 정상 확인</div>

    <div id="homeInfo" class="home-info">
      사용자 정보를 불러오는 중...
    </div>

    <button
      id="logoutBtn"
      class="secondary"
    >
      로그아웃
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://rkudqmumanycqwlawacx.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_I40fxhiLGCCxDnRiYvb8FQ_FYPrf0aM";


const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const $ =
  id => document.getElementById(id);


function internalEmail(loginId){

  return (
    loginId
      .trim()
      .toLowerCase()
      +
    "@hwdk-assembly.com"
  );

}


function showStatus(
  message,
  type="info"
){

  const el =
    $("authStatus");

  el.className =
    `status ${type}`;

  el.textContent =
    message;

}


function clearStatus(){

  $("authStatus").className =
    "status";

  $("authStatus").textContent =
    "";

}


function showLogin(){

  $("loginBox")
    .classList
    .remove("hidden");

  $("signupBox")
    .classList
    .add("hidden");

  $("loginTab")
    .classList
    .add("active");

  $("signupTab")
    .classList
    .remove("active");

  clearStatus();

}


function showSignup(){

  $("signupBox")
    .classList
    .remove("hidden");

  $("loginBox")
    .classList
    .add("hidden");

  $("signupTab")
    .classList
    .add("active");

  $("loginTab")
    .classList
    .remove("active");

  clearStatus();

}


async function loadHome(){

  const {
    data:{
      user
    }
  } =
    await sb.auth.getUser();


  if(!user){

    $("homeCard")
      .classList
      .add("hidden");

    $("authCard")
      .classList
      .remove("hidden");

    return;
  }


  const {
    data:profile,
    error
  } =
    await sb
      .from("user_profiles")
      .select(
        "login_id,name,department,position,active"
      )
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  $("authCard")
    .classList
    .add("hidden");

  $("homeCard")
    .classList
    .remove("hidden");


  if(error){

    $("homeInfo").innerHTML =
      `
      로그인 성공<br>
      사용자 프로필 조회 실패:<br>
      ${error.message}
      `;

    return;
  }


  $("homeInfo").innerHTML =
    `
    <strong>${profile?.name || "사용자"}</strong>님 로그인 완료<br><br>
    아이디: ${profile?.login_id || "-"}<br>
    부서: ${profile?.department || "미설정"}<br>
    직책: ${profile?.position || "미설정"}
    `;

}


$("loginTab")
  .addEventListener(
    "click",
    showLogin
  );


$("signupTab")
  .addEventListener(
    "click",
    showSignup
  );


$("signupBtn")
  .addEventListener(
    "click",
    async () => {

      clearStatus();


      const loginId =
        $("signupId")
          .value
          .trim()
          .toLowerCase();


      const name =
        $("signupName")
          .value
          .trim();


      const password =
        $("signupPassword")
          .value;


      const password2 =
        $("signupPassword2")
          .value;


      if(
        !/^[a-z0-9._-]{3,30}$/
          .test(loginId)
      ){

        showStatus(
          "아이디는 영문 소문자, 숫자, ., _, - 조합 3~30자로 입력하세요.",
          "err"
        );

        return;
      }


      if(!name){

        showStatus(
          "이름을 입력하세요.",
          "err"
        );

        return;
      }


      if(
        password.length < 6
      ){

        showStatus(
          "비밀번호는 6자 이상 입력하세요.",
          "err"
        );

        return;
      }


      if(
        password !== password2
      ){

        showStatus(
          "비밀번호가 서로 다릅니다.",
          "err"
        );

        return;
      }


      showStatus(
        "회원가입 처리 중...",
        "info"
      );


      const email =
        internalEmail(
          loginId
        );


      const {
        data,
        error
      } =
        await sb.auth.signUp({

          email,

          password,

          options:{

            data:{
              login_id:
                loginId,

              name:
                name,

              department:
                "조립",

              position:
                ""
            }

          }

        });


      if(error){

        showStatus(
          `회원가입 실패: ${error.message}`,
          "err"
        );

        return;
      }


      if(
        data?.session
      ){

        showStatus(
          "회원가입 완료. 로그인되었습니다.",
          "ok"
        );

        await loadHome();

      }else{

        showStatus(
          "회원가입 계정은 생성됐지만 이메일 확인 설정이 켜져 있습니다. 이 화면을 캡처해서 보내주세요.",
          "info"
        );

      }

    }
  );


$("loginBtn")
  .addEventListener(
    "click",
    async () => {

      clearStatus();


      const loginId =
        $("loginId")
          .value
          .trim()
          .toLowerCase();


      const password =
        $("loginPassword")
          .value;


      if(
        !loginId ||
        !password
      ){

        showStatus(
          "아이디와 비밀번호를 입력하세요.",
          "err"
        );

        return;
      }


      showStatus(
        "로그인 중...",
        "info"
      );


      const {
        error
      } =
        await sb
          .auth
          .signInWithPassword({

            email:
              internalEmail(
                loginId
              ),

            password

          });


      if(error){

        showStatus(
          `로그인 실패: ${error.message}`,
          "err"
        );

        return;
      }


      await loadHome();

    }
  );


$("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      await sb.auth.signOut();

      $("homeCard")
        .classList
        .add("hidden");

      $("authCard")
        .classList
        .remove("hidden");

      showLogin();

    }
  );


(async function init(){

  const {
    data:{
      session
    }
  } =
    await sb.auth.getSession();


  if(session){

    await loadHome();

  }else{

    showLogin();

  }

})();

</script>

</body>
</html>
